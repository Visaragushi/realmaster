<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/styles/login.css" />
    <!--=============== REMIXICONS ===============-->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <!--=============== CSS ===============-->
    <link rel="shortcut icon" href="./images/favicon.ico" type="image/x-icon">
    <title>Login</title>
</head>
<body>
    {% if user.is_authenticated %}
    <div class="container-administrador">
        <div class="container-admin">
            <p class="admin-text">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-person-gear" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M11 5a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM8 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" />
                    <path d="M8.256 14a4.474 4.474 0 0 1-.229-1.004H3c.001-.246.154-.986.832-1.664C4.484 10.68 5.711 10 8 10c.26 0 .507.009.74.025.226-.341.496-.65.804-.918C9.077 9.038 8.564 9 8 9c-5 0-6 3-6 4s1 1 1 1h5.256Z" />
                    <path fill-rule="evenodd" d="M11.886 9.46c.18-.613 1.048-.613 1.229 0l.043.148a.64.64 0 0 0 .921.382l.136-.074c.561-.306 1.175.308.87.869l-.075.136a.64.64 0 0 0 .382.92l.149.045c.612.18.612 1.048 0 1.229l-.15.043a.64.64 0 0 0-.38.921l.074.136c.305.561-.309 1.175-.87.87l-.136-.075a.64.64 0 0 0-.92.382l-.045.149c-.18.612-1.048.612-1.229 0l-.043-.15a.64.64 0 0 0-.921-.38l-.136.074c-.561.305-1.175-.309-.87-.87l.075-.136a.64.64 0 0 0-.382-.92l-.148-.045c-.613-.18-.613-1.048 0-1.229l.148-.043a.64.64 0 0 0 .382-.921l-.074-.136c-.306-.561.308-1.175.869-.87l.136.075a.64.64 0 0 0 .92-.382l.045-.148ZM14 12.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" />
                </svg>
                {{ user.first_name }}
            </p>
        </div>
        <div class="admin-container">
            <div class="admin-item">
                <h2 class="services-title">Services</h2>
                <ul class="container-services">
                    <a class="services-item-href" href="{% url 'plates' %}">
                        <li class="services-item">
                            <i class="fas fa-id-card"></i> Register Plates
                        </li>
                    </a>
                    <a class="services-item-href" href="{% url 'employe' %}">
                        <li class="services-item">
                            <i class="fas fa-users"></i> Register Employees
                        </li>
                    </a>
                    <a class="services-item-href" href="{% url 'admin-plates' %}">
                        <li class="services-item">
                            <i class="fas fa-list"></i> Check Plates
                        </li>
                    </a>
                    <a class="services-item-href" href="{% url 'admin-employe' %}">
                        <li class="services-item">
                            <i class="fas fa-user-check"></i> Check Employees
                        </li>
                    </a>
                    <a class="services-item-href" href="{% url 'logout' %}">
                        <li class="services-item">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </li>
                    </a>
                </ul>
            </div>
            <div class="admin-footer">
            </div>
        </div>
    </div>
    {% else %}
    <div class="login">
        <div class="login-container">
            <form action="{% url 'login' %}" class="login__form" method="post">
                {% csrf_token %}
                <h1 class="login__title">Login</h1>
                <div class="login__content">
                    <div class="login__box">
                        <i class="ri-user-3-line login__icon"></i>
                        <div class="login__box-input">
                            <input type="email" name="email" required class="login__input" id="login-email" placeholder=" ">
                            <label for="login-email" class="login__label">Email</label>
                        </div>
                    </div>

                    <div class="login__box">
                        <i class="ri-lock-2-line login__icon"></i>
                        <div class="login__box-input">
                            <input type="password" name="password" required class="login__input" id="login-pass" placeholder=" ">
                            <label for="login-pass" class="login__label">Password</label>
                            <i class="ri-eye-off-line login__eye" id="login-eye"></i>
                        </div>
                    </div>
                </div>

                <div class="login__check">
                    <button type="submit" class="login__button">Login</button>
                </div>
            </form>
        </div>
    </div>
    <script src="../static/js/login.js"></script>
    <script src="../static/js/security.js"></script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    {% endif %}
</body>
</html>
