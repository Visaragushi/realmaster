{% load static %}
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/flags.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@6.3.0/css/flag-icons.min.css">
    <link rel="stylesheet" href="../static/styles/translate.css" />
</head>
<nav class="nav-container">
    <a class="nav-logo" href="{% url 'home' %}">
        <img class="nav-log-img" src="../static/img/logo.jpg" alt="">
    </a>
    <div class="nav-movile">
        <button class="btn-movile-nab" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasTop"
            aria-controls="offcanvasTop">
            <svg id="movile-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                class="bi bi-list" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5z" />
            </svg>
        </button>
    </div>
    <ul class="nav-container-items">
        <div class="navbar">
            <a class="nav-item animate__animated animate__backInLeft animate__slow" href="{% url 'home' %}">
                <li>
                    <i class="fas fa-home"></i> Home
                </li>
            </a>
            <a class="nav-item animate__animated animate__backInLeft animate__slow" href="{% url 'main' %}">
                <li>
                    <i class="fas fa-utensils"></i> Menu
                </li>
            </a>
        </div>
        <li class="nav-item flex-end animate__animated animate__backInLeft animate__slow" data-bs-toggle="offcanvas"
            data-bs-target="#offcanvasRight">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-person-gear"
                viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M11 5a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM8 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" />
                <path
                    d="M8.256 14a4.474 4.474 0 0 1-.229-1.004H3c.001-.246.154-.986.832-1.664C4.484 10.68 5.711 10 8 10c.26 0 .507.009.74.025.226-.341.496-.65.804-.918C9.077 9.038 8.564 9 8 9c-5 0-6 3-6 4s1 1 1 1h5.256Z" />
                <path fill-rule="evenodd"
                    d="M11.886 9.46c.18-.613 1.048-.613 1.229 0l.043.148a.64.64 0 0 0 .921.382l.136-.074c.561-.306 1.175.308.87.869l-.075.136a.64.64 0 0 0 .382.92l.149.045c.612.18.612 1.048 0 1.229l-.15.043a.64.64 0 0 0-.38.921l.074.136c.305.561-.309 1.175-.87.87l-.136-.075a.64.64 0 0 0-.92.382l-.045.149c-.18.612-1.048.612-1.229 0l-.043-.15a.64.64 0 0 0-.921-.38l-.136.074c-.561.305-1.175-.309-.87-.87l.075-.136a.64.64 0 0 0-.382-.92l-.148-.045c-.613-.18-.613-1.048 0-1.229l.148-.043a.64.64 0 0 0 .382-.921l-.074-.136c-.306-.561.308-1.175.869-.87l.136.075a.64.64 0 0 0 .92-.382l.045-.148ZM14 12.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" />
            </svg>
            {% if user.is_authenticated %}
            Admin
            {% else %}
            Login
            {% endif %}
        </li>
    </ul>
</nav>

<!--navb movile-->
<div class="offcanvas offcanvas-top" tabindex="-1" id="offcanvasTop" aria-labelledby="offcanvasTopLabel">
    <div class="offcanvas-header">
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close" style="position: absolute; right: 20px; top: 40px; z-index: 1050;"></button>
    </div>
    <div class="offcanvas-body">
        {% include './movile/navMovile.html' %}
    </div>
</div>

<!--offcanvas-->
<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasRightLabel"></h5>
        <button id="btn-close" type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvasQ-body">
        {% include './admin.html' %}
    </div>
</div>
<script src="../static/js/security.js"></script>
