<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Managing Employees</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous" />
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rosarivo&display=swap" rel="stylesheet">
  <!-- Animate -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

  <link rel="stylesheet" href="../static/styles/home.css" />
  <link rel="stylesheet" href="../static/styles/nav.css" />
  <link rel="stylesheet" href="../static/styles/navMovile/navMovile.css" />
  <link rel="stylesheet" href="../static/styles/footer.css" />
  <link rel="stylesheet" href="../static/styles/crud/crudEmploye.css" />

</head>

<body>
  <header>
    {% include './shared/nav.html' %}
  </header>

  <main class="crud">
    <div class="crud-container">
      {%for empleado in empleados%}
      <div class="crud-table-info-employe">
        <p class="crud-table-item-employe-id">{{empleado.id}}</p>
        <div class="item-name">
          <p class="crud-table-item-employe">{{empleado.nombre}}</p>
          <p class="crud-table-item-employe">{{empleado.apellido}}</p>
        </div>
        <p class="crud-table-item-employe">{{empleado.role_name}}</p>
        <p class="crud-table-item-employe-salary">${{empleado.salario}}</p>
        <div class="crud-table-item"><img class="img-plato-crud" src={{empleado.foto}} alt=""></div>
        <div class="crud-table-item-absolutee"><form action="{% url 'delete-employee' empleado.id %}" method="POST" style="display:inline;">
          {% csrf_token %}
          <button type="submit" style="border:none;background:none;padding:0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
              class="bi bi-trash3" viewBox="0 0 16 16">
              <path
                d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5ZM11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H2.506a.58.58 0 0 0-.01 0H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1h-.995a.59.59 0 0 0-.01 0H11Zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5h9.916Zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47ZM8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5Z" />
            </svg>
          </button>
        </form></div>
      </div>
      {%endfor%}
      </table>
      <div>
  </main>

  <footer class="footer">
 {% include './shared/footer.html' %}
  </footer>


  <script src="../static/js/wow.min.js"></script>
  <script src="../static/js/security.js"></script>


  <!-- JavaScript Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3"
    crossorigin="anonymous"></script>
  <script>
    new WOW().init()
  </script>

</body>

</html>
